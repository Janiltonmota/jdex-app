<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDEX - Bem-vindo</title>
    <style>
        :root {
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-900: #111827;
            --gray-800: #1f2937;
            --gray-700: #374151;
            --gray-600: #4b5563;
            --gray-500: #6b7280;
            --gray-400: #9ca3af;
            --gray-300: #d1d5db;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --white: #ffffff;
            --black: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, var(--gray-50), var(--gray-100));
            color: var(--gray-900);
        }

        .dark {
            background: linear-gradient(to bottom, var(--gray-900), var(--gray-800));
            color: var(--gray-50);
        }

        .dark .text-gray-900 { color: var(--gray-50); }
        .dark .text-gray-600 { color: var(--gray-300); }
        .dark .text-gray-700 { color: var(--gray-300); }
        .dark .bg-white { background-color: var(--gray-800); }
        .dark .border-t { border-top-color: var(--gray-700); }
        .dark .hover:bg-gray-50 { background-color: var(--gray-700); }
        .dark .hover:bg-gray-700 { background-color: var(--gray-600); }

        header {
            background-color: var(--white);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        .dark header {
            background-color: var(--gray-800);
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .h-16 {
            height: 4rem;
        }

        .space-x-8 > * + * {
            margin-left: 2rem;
        }

        .hidden {
            display: none;
        }

        @media (min-width: 640px) {
            .sm\:flex {
                display: flex;
            }
            .sm\:hidden {
                display: none;
            }
        }

        .text-xl {
            font-size: 1.25rem;
            line-height: 1.75rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .text-gray-800 {
            color: var(--gray-800);
        }

        .dark .text-gray-800 {
            color: var(--gray-100);
        }

        .hover:bg-gray-50:hover {
            background-color: var(--gray-50);
        }

        .dark .hover:bg-gray-700:hover {
            background-color: var(--gray-700);
        }

        .px-3 {
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }

        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .rounded-md {
            border-radius: 0.375rem;
        }

        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        .font-medium {
            font-weight: 500;
        }

        .text-gray-700 {
            color: var(--gray-700);
        }

        .dark .text-gray-300 {
            color: var(--gray-300);
        }

        .dark .dark:hover\text-gray-300:hover {
            color: var(--gray-50);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 3rem;
            padding-bottom: 3rem;
        }

        .max-w-4xl {
            max-width: 56rem;
        }

        .w-full {
            width: 100%;
        }

        .px-4 {
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .sm\:px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        .lg\:px-8 {
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .text-center {
            text-align: center;
        }

        .text-3xl {
            font-size: 1.875rem;
            line-height: 2.25rem;
            font-weight: 700;
        }

        .text-gray-900 {
            color: var(--gray-900);
        }

        .dark .text-gray-900 {
            color: var(--gray-50);
        }

        .mb-6 {
            margin-bottom: 1.5rem;
        }

        .text-lg {
            font-size: 1.125rem;
            line-height: 1.75rem;
        }

        .text-gray-600 {
            color: var(--gray-600);
        }

        .dark .text-gray-400 {
            color: var(--gray-400);
        }

        .mb-8 {
            margin-bottom: 2rem;
        }

        .space-x-4 > * + * {
            margin-left: 1rem;
        }

        .px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        .py-3 {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        .bg-blue-600 {
            background-color: var(--blue-600);
        }

        .text-white {
            color: var(--white);
        }

        .hover:bg-blue-700:hover {
            background-color: var(--blue-700);
        }

        .focus\:outline-none:focus {
            outline: none;
        }

        .focus\:ring-2:focus {
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.5);
        }

        .focus\:ring-blue-500:focus {
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.5);
        }

        .focus\:ring-offset-2:focus {
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.5), 0 0 0 4px var(--white);
        }

        footer {
            background-color: var(--white);
            border-top-width: 1px;
            border-top-style: solid;
            border-top-color: #e5e7eb;
        }

        .dark footer {
            background-color: var(--gray-800);
            border-top-color: var(--gray-700);
        }

        .py-6 {
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        .text-gray-500 {
            color: var(--gray-500);
        }

        .dark .text-gray-400 {
            color: var(--gray-400);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="flex justify-between items-center h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-gray-800 dark:text-gray-100">
                            JDEX
                        </a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 dark:text-gray-300 dark:hover:text-white">
                            Home
                        </a>
                        <a href="/trade" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 dark:text-gray-300 dark:hover:text-white">
                            Trade
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <div class="flex items-center">
                            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Connect Wallet</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container max-w-4xl w-full px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-6">
                Bem-vindo ao JDEX
            </h1>
            <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
                Plataforma de negociação descentralizada para ativos digitais
            </p>
            <div class="space-x-4">
                <a href="/trade"
                   class="px-6 py-3 bg-blue-600 text-white font-medium rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Acessar Área de Negociação
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <p class="text-sm text-gray-500 dark:text-gray-400 text-center">
                © 2026 JDEX. Todos os direitos reservados.
            </p>
        </div>
    </footer>
</body>
</html>
